<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Market Dashboard</title>
<style>
:root{--bg:#0d1128;--panel:#151a38;--line:#262d57;--tx:#e9ebf8;--mu:#8e95bd;--up:#4fd1a5;--dn:#ff6b6b;--am:#f2b84b;--ac:#7c8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:19px;margin:0}h2{font-size:15px;margin:28px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--mu);white-space:nowrap}
.lab{font-size:12px;color:var(--mu);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--tx);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mood{font-size:42px;font-weight:800;line-height:1.1;margin:22px 0 4px}
.sub{color:var(--mu);font-size:13px}
.gauge{position:relative;height:8px;border-radius:9px;margin:14px 0 4px;background:linear-gradient(90deg,#ff6b6b,#f2b84b,#4fd1a5)}
.gauge i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;transform:translateX(-50%)}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
svg{width:100%;height:auto;display:block}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar b{font-weight:600}.trk{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;background:var(--tx);border-radius:9px}
.bar span{text-align:right}.bar small{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:var(--panel);border-radius:10px;padding:10px 12px}
.stats strong{display:block;font-size:22px}.stats small{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:10px;padding:12px 14px}
.card h3{font-size:13px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}
.plan{border-left:4px solid var(--am);background:var(--panel);border-radius:0 10px 10px 0;padding:12px 16px}
.plan h3{margin:0 0 4px;font-size:17px}.plan h4{margin:14px 0 4px;font-size:13px}
.plan ul{margin:0;padding-left:18px}.plan li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
tr.go{cursor:pointer}tr.sel td{background:var(--panel)}
.note{color:var(--mu);font-size:12px;margin-top:10px}
.nav{margin:14px 0 4px}.mu{color:var(--mu);font-size:12px}a{color:var(--ac)}
.cand{background:var(--panel);border-radius:10px;padding:10px 14px;margin:8px 0}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;border:1px solid var(--line);margin:4px 6px 0 0}
.tag.g{color:var(--up);border-color:var(--up)}.tag.a{color:var(--am);border-color:var(--am)}
.cs{font-size:13px;margin-top:4px}.why{font-size:12px;color:var(--mu);margin-top:4px}
.sig{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--line)}
.sig.ok{color:var(--up)}.sig.watch{color:var(--am)}.sig.risk{color:var(--dn)}
.banner{border-radius:12px;padding:12px 14px;margin:12px 0 6px;font-weight:700;font-size:16px;background:#3a1620;border:1px solid #ff6b6b}
.banner.mid{background:#33290f;border-color:var(--am)}.banner.ok{background:#10302a;border-color:var(--up)}
.sc{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 0;border-top:1px solid var(--line)}
.sc .nm{font-weight:600}.sc .pc{font-weight:800;font-size:18px;text-align:right}
.sc .br{grid-column:1/3;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.sc .br i{display:block;height:100%;border-radius:9px}
.sc.me{background:var(--panel);border-radius:10px;padding:9px 10px}
.big{font-size:26px;font-weight:800;line-height:1.2}
.nc{border-left:4px solid var(--line);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 12px;margin:8px 0}
.nc.pos{border-color:var(--up)}.nc.neg{border-color:var(--dn)}.nc.neu{border-color:var(--am)}
.cd{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--ac);color:#0d1128}
.tag.r{color:var(--dn);border-color:var(--dn)}.ul{margin:6px 0;padding-left:18px}.ul li{margin:4px 0}
.sent{background:var(--panel);border-radius:12px;padding:14px;margin:14px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sent svg{width:170px;flex:none}
.adv2{display:flex;gap:8px;margin-top:8px}.adv2 div{flex:1;border-radius:10px;padding:8px;background:var(--bg);text-align:center}
.adv2 strong{display:block;font-size:24px}.adv2 small{font-size:11px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer}
.sx.sel{border-color:var(--tx)}.sx:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sx h4{margin:0;font-size:13px}.sx .n{font-size:11px;color:var(--mu)}
.sx .kv{display:flex;justify-content:space-between;gap:6px;margin-top:8px;font-size:11px;color:var(--mu)}.sx .kv b{display:block;font-size:14px}
.sx .cnt{display:flex;justify-content:space-between;margin-top:8px;font-size:12px}
.sx .mb{position:relative;height:5px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,#ff6b6b,#f2b84b,#4fd1a5)}
.sx .mb i{position:absolute;top:-3px;width:3px;height:11px;background:#fff;transform:translateX(-50%);border-radius:2px}
.tg{font-size:10px;border:1px solid;border-radius:99px;padding:0 7px;float:right;margin-left:4px}
</style>
</head>
<body>
<main>
  <div class="top"><h1>India market dashboard</h1><span class="pill" id="asof">Loading…</span></div>
  <div id="app"></div>
</main>
<script>
// ---- Rules you can change ----
const PERIODS = {"1 week":5, "1 month":21, "3 months":63, "6 months":126};
const MOODS = [[30,"Bearish","#ff6b6b"],[45,"Weak","#ff9a6b"],[55,"Neutral","#f2b84b"],[70,"Positive","#9bd96b"],[101,"Bullish","#4fd1a5"]];
// ------------------------------
let D, seg = "all", per = "1 week";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg = (a, n) => { const x = a.slice(-n); return x.reduce((s, v) => s + v, 0) / x.length; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function calc(s) {
  const n = PERIODS[per];
  const p20 = avg(s.p20, n), p50 = avg(s.p50, n), p200 = avg(s.p200, n);
  const adv = avg(s.adv, n), dec = avg(s.dec, n);
  const ad = adv + dec ? adv / (adv + dec) * 100 : 50;
  const line = s.line.slice(-(n + 1));
  const move = (line[line.length - 1] / line[0] - 1) * 100;
  const breadth = 0.2 * p20 + 0.35 * p50 + 0.25 * p200 + 0.2 * ad;
  const score = Math.round(0.8 * breadth + 0.2 * clamp(50 + move * 2.5, 0, 100));
  const m = MOODS.find(x => score < x[0]);
  return {p20, p50, p200, ad, line, move, score, mood: m[1], color: m[2]};
}

function counts(s) {
  const st = s.stocks.filter(k => D.stocks[k]).map(k => ({...D.stocks[k], s: k}));
  const c = [0, 1, 2].map(i => st.filter(x => x.e[i]).length);
  return {st, c, adv: st.filter(x => x.d > 0).length, dec: st.filter(x => x.d < 0).length,
          up1m: st.filter(x => x.m > 0).length, dn1m: st.filter(x => x.m <= 0).length};
}

function plan(s, r, all) {
  const {p20, p50, p200} = r;
  let t;
  if (p50 >= 65 && p200 >= 65) t = {h:"Strong trend: stay invested, but don't chase", c:"#4fd1a5",
    caution:["Strong runs end with sharp pullbacks, so keep a stop-loss on every position.","Avoid buying stocks that are already up sharply over the past month."],
    invest:["Hold winners and add on dips toward the 50 EMA.","Invest new money in parts over several weeks, not all at once."],
    trade:["Buy pullbacks in stocks that are above all three EMAs.","Trail your stop-loss under the 20 EMA as the stock rises."]};
  else if (p200 >= 55 && p20 < 40) t = {h:"Uptrend with a dip: wait for a base", c:"#f2b84b",
    caution:["The long-term trend is healthy but short-term strength has faded.","Don't average down on stocks that closed below their 50 EMA."],
    invest:["Keep long-term holdings and add slowly in the strongest stocks.","Keep some cash ready in case the dip deepens."],
    trade:["Wait for the 20 EMA reading to climb back above 50% before new breakout buys.","Use smaller position sizes until it does."]};
  else if (p50 >= 50 && p200 >= 45) t = {h:"Improving market: build positions gradually", c:"#9bd96b",
    caution:["Breadth is decent but not strong, so some stocks will lag.","Don't put all your money in one stock."],
    invest:["Add in stages and favour stocks above all three EMAs.","Pick quality businesses, not just cheap ones."],
    trade:["Take trades only in stocks above their 50 EMA.","Book part of the profit near recent highs."]};
  else if (p200 < 45 && p20 >= 55) t = {h:"Early recovery: test with small positions", c:"#f2b84b",
    caution:["Rebounds inside a weak trend often fail.","Most stocks are still below the 200 EMA, so the long-term trend is not repaired."],
    invest:["Keep new buying small and staggered.","Hold off on large commitments until the 200 EMA reading rises above 45%."],
    trade:["Use quick, small trades with tight stop-losses.","Take profits early instead of waiting for a big move."]};
  else if (p50 < 35 && p200 < 45) t = {h:"Weak market: stay mostly in cash", c:"#ff6b6b",
    caution:["Most stocks are in a downtrend, and cheap stocks can keep falling.","Avoid new breakout buys and don't average down."],
    invest:["Pause fresh lump-sum investing and continue only SIPs you already run.","Review your holdings and cut the weakest."],
    trade:["Avoid long trades until the 20 EMA reading recovers, then the 50.","If you trade anyway, use half your normal size."]};
  else t = {h:"Mixed market: be selective", c:"#f2b84b",
    caution:["Stocks are moving in different directions, so the index can mislead.","Avoid crowded trades that everyone is in."],
    invest:["Choose individual leaders instead of buying the whole group.","Spread purchases over time."],
    trade:["Trade only stocks above their 50 EMA.","Keep stop-losses tight."]};
  if (p20 >= 80) t.caution.unshift("Over 80% of stocks are above the 20 EMA, so the move is stretched and a pause or dip is likely.");
  if (p200 < 40) t.caution.push("Fewer than 40% of stocks are above the 200 EMA: the long-term trend is damaged.");
  if (s.n < 15) t.caution.push("This group has only " + s.n + " stocks, so one or two big moves can swing the readings.");
  if (s.key !== "all" && all) {
    const d = p50 - all.p50;
    if (d > 10) t.invest.push("This segment is stronger than the broader market (" + Math.round(p50) + "% vs " + Math.round(all.p50) + "% above the 50 EMA), so it can deserve a larger share while that lasts.");
    else if (d < -10) t.caution.push("This segment is weaker than the broader market (" + Math.round(p50) + "% vs " + Math.round(all.p50) + "% above the 50 EMA): money is flowing elsewhere.");
  }
  return t;
}

function chart(r, s) {
  const L = r.line, mn = Math.min(...L), mx = Math.max(...L), W = 600, H = 190;
  const X = i => 10 + i * (W - 20) / (L.length - 1), Y = v => 10 + (mx - v) / ((mx - mn) || 1) * (H - 20);
  const pts = L.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
  const col = r.move >= 0 ? "#4fd1a5" : "#ff6b6b";
  const fmt = v => s.real ? Math.round(v).toLocaleString("en-IN") : v.toFixed(1);
  return `<div class="sub"><b class="${r.move >= 0 ? "up" : "dn"}">${r.move >= 0 ? "+" : ""}${r.move.toFixed(1)}%</b> over ${per} · now ${fmt(L[L.length - 1])}</div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart"><polygon points="${X(0)},${H} ${pts} ${X(L.length - 1)},${H}" fill="${col}" opacity=".15"/>
  <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="10" y="14" fill="#8e95bd" font-size="14">High ${fmt(mx)}</text><text x="10" y="${H - 4}" fill="#8e95bd" font-size="14">Low ${fmt(mn)}</text></svg>
  <div class="note">${s.real ? "Line shows the Nifty 50 index." : "Line shows an equal-weighted average of this group's stocks, not the official index."}</div>`;
}

function list(arr, cls) {
  return arr.length ? arr.map(x => `<div class="row"><span>${esc(x.n)}</span><span class="${cls}">${x.m > 0 ? "+" : ""}${x.m}%</span></div>`).join("")
    : '<div class="sub">None right now.</div>';
}

// ---- Market decision rules (Trade / Wait / No trade). Change the numbers to suit you ----
const DEC = {vixStop: 24, vixCalm: 20, p50Go: 50, p200Go: 45, p50Stop: 30};
const MMI_W = {trend: 33, breadth: 28, vol: 17, sector: 17, event: 5};  // points out of 100
const MMI_N = {trend: "Price trend", breadth: "Market breadth", vol: "Volatility and risk", sector: "Sector strength", event: "Global and flow risk"};
const ema = (a, n) => { const k = 2 / (n + 1); return a.reduce((e, v) => v * k + e * (1 - k)); };

function market() {
  const all = D.segments.find(x => x.key === "all"); if (!all) return null;
  const r = calc(all), L = all.line, c = L[L.length - 1];
  const e20 = ema(L, 20), e50 = ema(L, 50), mv = (c / L[Math.max(0, L.length - 22)] - 1) * 100;
  const vix = ((D.macro || []).find(x => x.k === "vix") || {}).v;
  const sec = D.segments.filter(x => x.group === "sector").map(calc), strongSec = sec.filter(x => x.p50 >= 50).length;
  const sg = signals().filter(x => x.k !== "breadth"), rk = sg.filter(x => x.lvl === "risk").length, wt = sg.filter(x => x.lvl === "watch").length, ev = 2 * rk + wt;
  const comp = {
    trend: {v: 0.4 * (c > e20) + 0.4 * (c > e50) + 0.2 * clamp(0.5 + mv / 10, 0, 1),
      why: `Nifty 50 is ${c > e20 ? "above" : "below"} its 20 EMA and ${c > e50 ? "above" : "below"} its 50 EMA; ${f1(mv)} in the last month.`},
    breadth: {v: (0.2 * r.p20 + 0.4 * r.p50 + 0.25 * r.p200 + 0.15 * r.ad) / 100,
      why: `${Math.round(r.p50)}% of Nifty 500 stocks are above the 50 EMA; ${Math.round(r.ad)}% of daily moves were advances (average of last ${per}).`},
    vol: vix == null ? null : {v: clamp((26 - vix) / 14, 0, 1), why: `India VIX is ${vix}. Lower means calmer.`},
    sector: sec.length ? {v: strongSec / sec.length, why: `${strongSec} of ${sec.length} sectors have more than half their stocks above the 50 EMA.`} : null,
    event: sg.length ? {v: clamp(1 - ev / 10, 0, 1), why: `${rk} risk and ${wt} watch signals among global and flow factors.`} : null,
  };
  const keys = Object.keys(MMI_W).filter(k => comp[k]);
  const score = Math.round(keys.reduce((t, k) => t + comp[k].v * MMI_W[k], 0) / keys.reduce((t, k) => t + MMI_W[k], 0) * 100);
  const mo = MOODS.find(x => score < x[0]);
  const regime = c > e20 && e20 > e50 && r.p50 >= 50 ? "Trending up" : c < e20 && e20 < e50 && r.p50 < 40 ? "Trending down"
    : Math.abs(e20 / e50 - 1) < 0.01 && Math.abs(mv) < 3 ? "Ranging" : "Uncertain";
  const chk = [[regime === "Trending up", `Market is trending up (now: ${regime.toLowerCase()})`],
    [r.p50 >= DEC.p50Go, `At least ${DEC.p50Go}% of stocks above the 50 EMA (now ${Math.round(r.p50)}%)`],
    [r.p200 >= DEC.p200Go, `At least ${DEC.p200Go}% of stocks above the 200 EMA (now ${Math.round(r.p200)}%)`]];
  if (vix != null) chk.push([vix < DEC.vixCalm, `India VIX below ${DEC.vixCalm} (now ${vix})`]);
  if (sg.length) chk.push([ev < 4, `Global and flow risks are low or moderate (${rk} risk, ${wt} watch)`]);
  if (vix == null || !sg.length) chk.push([false, "India VIX and global data is available (it is missing right now, so TRADE is not given)"]);
  const stops = [];
  if (vix != null && vix >= DEC.vixStop) stops.push(`India VIX is ${vix}, so fear is high.`);
  if (ev >= 7) stops.push("Many global or flow risks are active at once.");
  if (r.p50 < DEC.p50Stop) stops.push(`Only ${Math.round(r.p50)}% of stocks are above the 50 EMA.`);
  if (regime === "Trending down") stops.push("The index is in a downtrend.");
  const flags = [];
  if (mv > 0 && r.p50 < 40) flags.push("The index is up this month but most stocks are below their 50 EMA, so participation is weak.");
  if (r.p20 < r.p50 - 8) flags.push("Short-term breadth is lagging the medium term: a pullback is under way.");
  const decision = stops.length ? "NO TRADE" : chk.every(x => x[0]) ? "TRADE" : "WAIT";
  return {score, mood: mo[1], color: mo[2], comp, regime, chk, stops, flags, decision};
}

function decisionPanel(m) {
  const cls = {"TRADE": "ok", "WAIT": "mid", "NO TRADE": ""}[m.decision];
  const say = {"TRADE": "Conditions line up. Take only valid setups, with the stop-loss and position size fixed before you enter.",
    "WAIT": "Not every condition is met yet. Keep a watchlist and wait for confirmation instead of forcing a trade.",
    "NO TRADE": "Conditions are poor. Protect your capital and stay out of new trades."}[m.decision];
  const li = (g, c, t) => `<div class="row"><span style="white-space:normal"><b class="${c}">${g}</b> ${t}</span></div>`;
  return `<div class="banner ${cls}"><div class="mu" style="font-weight:400">Market decision (Nifty 500 and Nifty 50)</div><div style="font-size:28px">${m.decision}</div>
  <div style="font-size:13px;font-weight:400;margin-top:2px">${say}</div></div>
  <div class="card"><h3>Regime: ${m.regime}</h3>
  ${m.stops.map(t => li("✗ Stop:", "dn", t)).join("")}${m.flags.map(t => li("⚠", "am", t)).join("")}
  <h3 style="margin-top:10px">What must be true before a trade is valid</h3>
  ${m.chk.map(x => li(x[0] ? "✓" : "✗", x[0] ? "up" : "dn", x[1])).join("")}
  <div class="note">Prices as of ${esc(D.asof)}. Data is end of day (Yahoo Finance and NSE lists), so it is delayed. A TRADE reading means conditions are acceptable, not that any stock is a buy.</div></div>`;
}

function mmiDetails(m) {
  const rows = Object.keys(MMI_W).map(k => { const c = m.comp[k];
    return `<tr><td>${MMI_N[k]}</td><td>${c ? Math.round(c.v * MMI_W[k]) : "–"} / ${MMI_W[k]}</td><td style="text-align:left">${c ? c.why : "No data, so this part is left out of the score."}</td></tr>`; }).join("");
  return `<details style="margin:10px 0"><summary>How the Market Mood Index of ${m.score} is built</summary>
  <table><tr><th>Part</th><th>Points</th><th style="text-align:left">Why</th></tr>${rows}</table>
  <div class="note">Each part earns up to its points. Half the points is neutral, so more means that part raised the score and less means it lowered it. If a part has no data it is dropped and the rest is scaled to 100. Segment cards below use breadth only.</div></details>`;
}

function gauge(sc, col) {
  const pt = f => { const a = Math.PI * (1 - f); return [(90 + 70 * Math.cos(a)).toFixed(1), (90 - 70 * Math.sin(a)).toFixed(1)]; };
  const e = pt(clamp(sc, 1, 99) / 100);
  return `<svg viewBox="0 0 180 112" role="img" aria-label="Market sentiment ${sc} out of 100"><path d="M20 90A70 70 0 0 1 160 90" fill="none" stroke="#262d57" stroke-width="14" stroke-linecap="round"/><path d="M20 90A70 70 0 0 1 ${e[0]} ${e[1]}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/><text x="90" y="86" text-anchor="middle" font-size="30" font-weight="800" fill="${col}">${sc}</text><text x="90" y="106" text-anchor="middle" font-size="11" fill="#8e95bd">out of 100</text></svg>`;
}

function sentiment(all, ra, ka, m) {
  const sc = m ? m.score : ra.score, col = m ? m.color : ra.color, mw = m ? m.mood : ra.mood;
  return `<div class="sent">${gauge(sc, col)}<div style="flex:1;min-width:180px"><div class="lab" style="margin:0">Market Mood Index</div><div class="big" style="color:${col}">${mw}</div>
  <div class="adv2"><div><strong class="dn">${ka.dec}</strong><small>declining</small></div><div><strong class="up">${ka.adv}</strong><small>advancing</small></div></div>
  <div class="note" style="margin-top:8px">${ka.adv > ka.dec ? "More stocks rose than fell today." : "More stocks fell than rose today."}</div></div></div>`;
}

function cards(title, arr, sortIt) {
  const items = arr.map(x => ({x, r: calc(x), k: counts(x)}));
  if (sortIt) items.sort((a, b) => b.r.score - a.r.score);
  return `<div class="lab">${title}</div><div class="grid">${items.map(({x, r, k}) => {

    const act = E.actions.length ? '<table><tr><th>Stock</th><th>Action</th><th>Date</th></tr>' + E.actions.map(x =>
      `<tr><td>${esc(x.n)}</td><td style="text-align:left">${esc(x.what)}</td><td>${fd(x.d)}</td></tr>`).join("") + "</table>"
      : '<p class="sub">No splits, bonus issues or dividends found in the next 30 days. See the headlines below for announcements.</p>';
    const order = ["Splits, bonus and buybacks", "Orders and deals", "Investments and expansion", "Approvals and upgrades", "Results and dividends", "Risks and red flags"];
    const tone = {pos: ['g', 'Possible positive'], neg: ['r', 'Possible negative'], neu: ['', 'Event']};
    const EM = {"Splits, bonus and buybacks": "✂️", "Orders and deals": "📦", "Investments and expansion": "🏗️", "Approvals and upgrades": "✅", "Results and dividends": "🧾", "Risks and red flags": "⚠️"};
    const cats = order.map(c => {
      const a = E.catalysts.filter(x => x.cat === c);
      return a.length ? `<h3 style="margin:16px 0 4px">${EM[c]} ${c}</h3>` + a.map(x => `<div class="nc ${x.tone}"><b>${x.n ? esc(x.n) : "Market"}</b> <span class="tag ${tone[x.tone][0]}">${tone[x.tone][1]}</span><div>${link(x.t, x.l)}</div><div class="mu">${esc(x.p)} ${esc(x.d)}</div></div>`).join("") : "";
    }).join("");
    body = `<h2>FII and DII buying and selling</h2>${fiiBlock()}<h2>Upcoming key dates in India</h2>${keyDates("Domestic")}
    <h2>Upcoming results (next 30 days)</h2>${res}
    <div class="note">Stocks often gap 5-10% on results. Swing traders usually exit or cut size before the date unless they are holding on purpose. The Q2 results season runs roughly from mid-October to mid-November.</div>
    <h2>Splits, bonus, dividends and buybacks</h2>${act}
    <h2>Stock catalysts from the news</h2>${cats || '<p class="sub">No catalyst headlines found.</p>'}
    <div class="note">A headline is a possible reason for a move, not a signal to buy. Prices often move before news reaches you, so check the chart and how far the stock has already run. Tags come from keywords in the headline.</div>
    <h2>India market headlines</h2>${nlist(E.dom)}`;
  } else {
    const fl = signals().filter(x => x.lvl !== "ok");
    body = `<h2>Global markets scoreboard</h2>${scoreboard()}<h2>Upcoming key dates worldwide</h2>${keyDates("Global")}
    <h2>What global moves mean for India now</h2>${fl.length ? '<ul class="ul">' + fl.map(x => `<li><span class="sig ${x.lvl}">${x.lvl === "risk" ? "Risk" : "Watch"}</span> <b>${esc(x.n)}:</b> ${esc(x.txt)}</li>`).join("") + "</ul>" : '<p class="sub">No warning signs in global markets right now.</p>'}
    ${Object.keys(E.glob).map(t => `<h2>${esc(t)}</h2>${nlist(E.glob[t])}`).join("")}
    <div class="note">Headlines come from news feeds and are shown as links. They are not a forecast. The Global factors tab has the numbers behind each market.</div>`;
  }
  $("app").innerHTML = nav() + tabs + body;
}

function renderMacro() {
  $("asof").textContent = "Data as of " + D.asof;
  if (!(D.macro || []).length) { $("app").innerHTML = nav() + '<p class="dn">No market factor data yet. Run "Update market data" in GitHub Actions and reload.</p>'; return; }
  const sg = signals(), mr = macroRisk(), plan = MP[mr.label], sm = {};
  sg.forEach(x => sm[x.k] = x);
  const flags = sg.filter(x => x.lvl !== "ok");
  const net = {};
  sg.forEach(x => Object.keys(x.imp).forEach(k => { net[k] = (net[k] || 0) + (x.imp[k] === "+" ? 1 : -1); }));
  const nm = k => (D.segments.find(x => x.key === k) || {}).name;
  const helped = Object.keys(net).filter(k => net[k] > 0 && nm(k)).map(nm), hurt = Object.keys(net).filter(k => net[k] < 0 && nm(k)).map(nm);
  const groups = ["India", "Global markets", "Commodities", "Currency and bonds", "Volatility"].map(g => {
    const rows = D.macro.filter(x => x.g === g).map(x => {
      const q = sm[x.k], c = v => `<td class="${v >= 0 ? "up" : "dn"}">${f1(v)}</td>`;
      return `<tr><td>${esc(x.n)}</td><td>${fv(x.v)}</td>${c(x.d)}${c(x.m)}<td>${q ? `<span class="sig ${q.lvl}">${q.lvl === "ok" ? "OK" : q.lvl === "watch" ? "Watch" : "Risk"}</span>` : "–"}</td></tr>`;
    }).join("");
    return rows ? `<h2>${g}</h2><table><tr><th>Factor</th><th>Level</th><th>Today</th><th>1 month</th><th>Signal</th></tr>${rows}</table>` : "";
  }).join("");
  $("app").innerHTML = `${nav()}
  <div class="mood" style="color:${mr.color}">${mr.label} risk</div>
  <div class="sub">${flags.length} of ${sg.length} global and domestic factors are showing a warning right now.</div>
  <h2>Plan to avoid unnecessary risk</h2>
  <div class="plan" style="border-color:${mr.color}"><h4>Be cautious</h4><ul>${li(plan.c)}</ul><h4>If you invest</h4><ul>${li(plan.i)}</ul><h4>If you swing trade</h4><ul>${li(plan.t)}</ul></div>
  <h2>What is flashing now</h2>
  ${flags.length ? '<ul class="ul">' + flags.map(x => `<li><span class="sig ${x.lvl}">${x.lvl === "risk" ? "Risk" : "Watch"}</span> <b>${esc(x.n)}:</b> ${esc(x.txt)}</li>`).join("") + "</ul>" : '<p class="sub">No warning signs. Conditions look calm.</p>'}
  ${helped.length || hurt.length ? `<h2>Sectors likely helped or hurt</h2><div class="two"><div class="card"><h3 class="up">Likely helped</h3><div class="sub">${helped.length ? helped.map(esc).join(", ") : "None"}</div></div><div class="card"><h3 class="dn">Likely hurt</h3><div class="sub">${hurt.length ? hurt.map(esc).join(", ") : "None"}</div></div></div>` : ""}
  ${groups}
  <h2>Check these before big trades</h2><ul class="ul">${li(EVENTS)}</ul>
  <div class="note">The dashboard reads price moves in markets, commodities, currencies and bonds. It cannot read news or events, so check the list above yourself. Readings are rules of thumb, not predictions. This is a decision aid, not financial advice.</div>`;
}

function why(s, r, ra, k) {
  const sg = signals().filter(x => x.imp[s.key]);
  const st = k.st.slice().sort((a, b) => a.d - b.d);
  const dn = st.slice(0, 3).filter(x => x.d < 0), up = st.slice(-3).reverse().filter(x => x.d > 0);
  const dir = r.move >= 0 ? "rising" : "falling", rs = [];
  rs.push(`${esc(s.name)} is ${dir}: ${f1(r.move)} over ${per}. Today ${k.adv} stocks rose and ${k.dec} fell.`);
  rs.push(r.p50 < 35 ? `Selling is widespread: only ${Math.round(r.p50)}% of stocks are above the 50 EMA, so this is a group-wide move, not one stock.`
    : r.p50 >= 65 ? `Buying is broad: ${Math.round(r.p50)}% of stocks are above the 50 EMA, so most of the group is taking part.`
    : `The picture is mixed: ${Math.round(r.p50)}% of stocks are above the 50 EMA, so the move is led by some stocks, not all.`);
  if (s.key !== "all" && ra) {
    const d = r.p50 - ra.p50;
    if (Math.abs(d) >= 10) rs.push(d > 0 ? `It is stronger than the broader market (${Math.round(r.p50)}% vs ${Math.round(ra.p50)}% above the 50 EMA), so money is moving into it.` : `It is weaker than the broader market (${Math.round(r.p50)}% vs ${Math.round(ra.p50)}% above the 50 EMA), so money is moving out of it.`);
  }
  if (dn.length) rs.push("Biggest drags today: " + dn.map(x => `${esc(x.n)} (${f1(x.d)})`).join(", ") + ".");
  if (up.length) rs.push("Biggest lifts today: " + up.map(x => `${esc(x.n)} (${f1(x.d)})`).join(", ") + ".");
  sg.forEach(x => rs.push(`${esc(x.txt)} Effect on ${esc(s.name)}: ${x.imp[s.key] === "+" ? "positive" : "negative"}.`));
  const news = [];
  dn.concat(up).forEach(x => ((D.news || {})[x.s] || []).slice(0, 1).forEach(n => news.push({...n, st: x.n})));
  return `<h2>Why is ${esc(s.name)} ${dir}?</h2><div class="card"><ul class="ul" style="margin:0">${li(rs)}</ul>
  ${news.length ? '<h3 style="margin:12px 0 4px">Recent headlines on the biggest movers</h3><ul class="ul" style="margin:0">' + news.map(n => `<li>${link(n.t, n.l)} <span class="mu">${esc(n.p)} ${esc(n.d)} · ${esc(n.st)}</span></li>`).join("") + "</ul>" : ""}
  <div class="note">These are likely drivers from price data and headlines, not confirmed causes. Read the news before acting.</div></div>`;
}

function renderSwing() {
  $("asof").textContent = "Data as of " + D.asof;
  const all = D.segments.find(x => x.key === "all"), p20 = avg(all.p20, 5), p50 = avg(all.p50, 5), mr = macroRisk();
  const bad = p50 < 35 || mr.label === "High", good = !bad && p50 >= 50 && p20 >= 40 && mr.label !== "Elevated";
  const G = bad ? {h: "Poor conditions: protect your capital", c: "#ff6b6b", l: ["Avoid fresh breakout buys: most fail when fewer than 35% of stocks are above the 50 EMA.", "If you trade, risk 0.25% of capital or less per trade and keep stops tight.", "Use this time to build a watchlist from the list below and wait for the market to improve.", "Never average down on a losing trade."]}
    : good ? {h: "Good conditions: breakouts have better odds", c: "#4fd1a5", l: ["Risk about 1% of your capital per trade.", "Hold up to 5 or 6 positions, spread across different sectors.", "Enter on a close above resistance with volume at least 1.5 times normal.", "Place the stop below the breakout candle's low, or use the stop idea shown on each stock."]}
    : {h: "Selective conditions: take only the best setups", c: "#f2b84b", l: ["Risk about 0.5% of capital per trade.", "Keep to 2 or 3 positions.", "Choose only stocks within 5% of their 52-week high, in sectors that are holding up.", "Book half the profit at the first target and move the stop to cost."]};
  const ALW = ["Check the results date before entering, and avoid holding through earnings unless it is planned.", "Skip a stock that is already more than 5% above its breakout level and wait for a pullback.", "Book half near a 1:2 reward-to-risk and trail the rest under the 20 EMA.", "Avoid trading on the day of RBI policy, US Fed decisions or other major events.", "Never move a stop-loss further away."];
  const sw = D.swing || [];
  const F = {brk: sw.filter(c => c.brk && c.vx >= 1.5), near: sw.filter(c => c.near), all: sw};
  const list = F[swF], secs = {};
  sw.forEach(c => { if (c.sec) secs[c.sec] = (secs[c.sec] || 0) + 1; });
  const top = Object.keys(secs).sort((a, b) => secs[b] - secs[a]).slice(0, 5).map(x => `${esc(x)} (${secs[x]})`).join(", ");
  const tabs = [["brk", "Breakouts with volume"], ["near", "Near 52-week high"], ["all", "All setups"]].map(([k, n]) => `<button class="${swF === k ? "on" : ""}" onclick="swF='${k}';render()">${n} (${F[k].length})</button>`).join("");
  const cards = list.length ? list.slice(0, 25).map(c => {
    const nw = ((D.news || {})[c.s] || [])[0], rd = ((D.events || {}).results || []).find(x => x.s === c.s), rdn = rd ? daysTo(rd.d) : 99;
    return `<div class="cand"><b>${esc(c.n)}</b> <span class="mu">${esc(c.sec)}</span><div>
    ${c.brk ? '<span class="tag g">Breakout in last 3 days</span>' : ""}${c.near ? '<span class="tag a">' + (c.d52 >= -0.5 ? "At 52-week high" : Math.abs(c.d52) + "% below 52-week high") + "</span>" : ""}<span class="tag">Volume ${c.vx}x normal</span>${rdn <= 10 ? '<span class="tag r">Results ' + inDays(rdn) + "</span>" : ""}</div>
    <div class="cs">₹${fv(c.p)} <span class="${c.d >= 0 ? "up" : "dn"}">${f1(c.d)}</span> today · ${f1(c.m)} in a month · Stop idea ₹${fv(c.stop)} (${c.risk}% risk)</div>
    <div class="why">${nw ? "Latest headline: " + link(nw.t, nw.l) + " (" + esc(nw.p) + ")" : "No recent headline found. Check the company's announcements before trading."}</div></div>`;
  }).join("") : '<p class="sub">No stocks match right now. That is useful information too: a market with few setups is not a market to force trades in.</p>';
  $("app").innerHTML = `${nav()}
  <div class="mood" style="color:${G.c};font-size:28px">${G.h}</div>
  <div class="sub">Based on ${Math.round(p50)}% of Nifty 500 stocks above the 50 EMA, ${Math.round(p20)}% above the 20 EMA, and ${mr.label.toLowerCase()} global risk.</div>
  <h2>Swing trading plan for today</h2><div class="plan" style="border-color:${G.c}"><ul>${li(G.l)}</ul><h4>Rules that always apply</h4><ul>${li(ALW)}</ul></div>
  <h2>Best setups for swing trading</h2><div class="chips" style="margin-bottom:8px">${tabs}</div>
  ${top ? `<div class="mu">Sectors with the most setups: ${top}</div>` : ""}${cards}
  <div class="note">Stocks must be above their 20 and 50 EMA and trade at least ₹5 crore a day. A breakout means a close above the 20-day high on volume at least 1.5 times the 20-day average. The stop idea is 1.5 times the 14-day average range below the price. This is a screen, not a recommendation. Check the chart and news first.</div>`;
}

function pick(k) { view = "seg"; seg = k; location.hash = k; render(); const el = document.getElementById("planbox"); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); else window.scrollTo(0, 0); }
function setPer(q) { per = q; render(); }

fetch("data.json?v=" + Date.now()).then(r => r.json()).then(d => {
  D = d;
  const h = location.hash.slice(1);
  if (h === "macro" || h === "swing" || h === "news") view = h;
  else if (D.segments.some(x => x.key === h)) seg = h;
  render();
}).catch(() => { $("app").innerHTML = '<p class="dn">Could not load data.json. Run "Update market data" in GitHub Actions and reload.</p>'; $("asof").textContent = "No data"; });
</script>
</body>
</html>
