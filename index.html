<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Market Dashboard</title>
<style>
:root{--bg:#0d1128;--panel:#151a38;--line:#262d57;--tx:#e9ebf8;--mu:#8e95bd;--up:#4fd1a5;--dn:#ff6b6b;--am:#f2b84b;--ac:#7c8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 60px;overflow-wrap:anywhere}
h1{font-size:19px;margin:0}h2{font-size:15px;margin:28px 0 10px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.pill{border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-size:12px;color:var(--mu);max-width:100%}
.lab{font-size:12px;color:var(--mu);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--tx);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mood{font-size:42px;font-weight:800;line-height:1.1;margin:22px 0 4px}
.sub{color:var(--mu);font-size:13px}
.gauge{position:relative;height:8px;border-radius:9px;margin:14px 0 4px;background:linear-gradient(90deg,#ff6b6b,#f2b84b,#4fd1a5)}
.gauge i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;transform:translateX(-50%)}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
svg{width:100%;height:auto;display:block}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar b{font-weight:600}.trk{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;background:var(--tx);border-radius:9px}
.bar span{text-align:right}.bar small{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:var(--panel);border-radius:10px;padding:10px 12px}
.stats strong{display:block;font-size:22px}.stats small{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:10px;padding:12px 14px}
.card h3{font-size:13px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}
.plan{border-left:4px solid var(--am);background:var(--panel);border-radius:0 10px 10px 0;padding:12px 16px}
.plan h3{margin:0 0 4px;font-size:17px}.plan h4{margin:14px 0 4px;font-size:13px}
.plan ul{margin:0;padding-left:18px}.plan li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
tr.go{cursor:pointer}tr.sel td{background:var(--panel)}
.note{color:var(--mu);font-size:12px;margin-top:10px}
.nav{margin:14px 0 4px}.mu{color:var(--mu);font-size:12px}a{color:var(--ac)}
.cand{background:var(--panel);border-radius:10px;padding:10px 14px;margin:8px 0}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;border:1px solid var(--line);margin:4px 6px 0 0}
.tag.g{color:var(--up);border-color:var(--up)}.tag.a{color:var(--am);border-color:var(--am)}
.cs{font-size:13px;margin-top:4px}.why{font-size:12px;color:var(--mu);margin-top:4px}
.sig{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--line)}
.sig.ok{color:var(--up)}.sig.watch{color:var(--am)}.sig.risk{color:var(--dn)}
.banner{border-radius:12px;padding:12px 14px;margin:12px 0 6px;font-weight:700;font-size:16px;background:#3a1620;border:1px solid #ff6b6b}
.banner.mid{background:#33290f;border-color:var(--am)}.banner.ok{background:#10302a;border-color:var(--up)}
.sc{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 0;border-top:1px solid var(--line)}
.sc .nm{font-weight:600}.sc .pc{font-weight:800;font-size:18px;text-align:right}
.sc .br{grid-column:1/3;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.sc .br i{display:block;height:100%;border-radius:9px}
.sc.me{background:var(--panel);border-radius:10px;padding:9px 10px}
.big{font-size:26px;font-weight:800;line-height:1.2}
.nc{border-left:4px solid var(--line);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 12px;margin:8px 0}
.nc.pos{border-color:var(--up)}.nc.neg{border-color:var(--dn)}.nc.neu{border-color:var(--am)}
.cd{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--ac);color:#0d1128}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.ic{background:var(--panel);border-radius:12px;padding:12px;cursor:pointer;border:1px solid var(--line)}
.ih{display:flex;justify-content:space-between;gap:8px}.bd{border:1px solid;border-radius:6px;padding:0 8px;font-size:11px;font-weight:700;height:20px;line-height:18px}
.im{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.ic3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:6px 0 12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0}
.vs .b{border-radius:10px;padding:10px;text-align:center;border:1px solid}.vs .b strong{display:block;font-size:26px}
.rg{position:relative;height:6px;border-radius:9px;background:linear-gradient(90deg,#ff6b6b,#f2b84b,#4fd1a5);margin:8px 0 4px}
.rg i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.hc{border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13px}.hc span{font-size:17px;font-weight:800}.hc small{color:#cfd3ee;font-size:11px}
details{margin-top:6px}summary{cursor:pointer;color:var(--ac);font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fg label{font-size:12px;color:var(--mu);display:block}
.sl{color:var(--tx);text-decoration:underline dotted;cursor:pointer}.chartbox svg{width:100%;height:auto}
.tag.r{color:var(--dn);border-color:var(--dn)}.ul{margin:6px 0;padding-left:18px}.ul li{margin:4px 0}
</style>
</head>
<body>
<main>
  <div class="top"><h1>India market dashboard</h1><span class="pill" id="asof">Loading…</span></div>
  <div id="app"></div>
</main>
<script>
// ---- Rules you can change ----
const PERIODS = {"1 week":5, "1 month":21, "3 months":63, "6 months":126};
const MOODS = [[30,"Bearish","#ff6b6b"],[45,"Weak","#ff9a6b"],[55,"Neutral","#f2b84b"],[70,"Positive","#9bd96b"],[101,"Bullish","#4fd1a5"]];
// ------------------------------
let D, seg = "all", per = "1 week";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg = (a, n) => { const x = a.slice(-n); return x.reduce((s, v) => s + v, 0) / x.length; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function calc(s) {
  const n = PERIODS[per];
  const p20 = avg(s.p20, n), p50 = avg(s.p50, n), p200 = avg(s.p200, n);
  const adv = avg(s.adv, n), dec = avg(s.dec, n);
  const ad = adv + dec ? adv / (adv + dec) * 100 : 50;
  const line = s.line.slice(-(n + 1));
  const move = (line[line.length - 1] / line[0] - 1) * 100;
  const breadth = 0.2 * p20 + 0.35 * p50 + 0.25 * p200 + 0.2 * ad;
  const score = Math.round(0.8 * breadth + 0.2 * clamp(50 + move * 2.5, 0, 100));
  const m = MOODS.find(x => score < x[0]);
  return {p20, p50, p200, ad, line, move, score, mood: m[1], color: m[2]};
}

function counts(s) {
  const st = s.stocks.filter(k => D.stocks[k]).map(k => ({...D.stocks[k], s: k}));
  const c = [0, 1, 2].map(i => st.filter(x => x.e[i]).length);
  return {st, c, adv: st.filter(x => x.d > 0).length, dec: st.filter(x => x.d < 0).length,
          up1m: st.filter(x => x.m > 0).length, dn1m: st.filter(x => x.m <= 0).length};
}

function plan(s, r, all) {
  const {p20, p50, p200} = r;
  let t;
  if (p50 >= 65 && p200 >= 65) t = {h:"Strong trend: stay invested, but don't chase", c:"#4fd1a5",
    caution:["Strong runs end with sharp pullbacks, so keep a stop-loss on every position.","Avoid buying stocks that are already up sharply over the past month."],
    invest:["Hold winners and add on dips toward the 50 EMA.","Invest new money in parts over several weeks, not all at once."],
    trade:["Buy pullbacks in stocks that are above all three EMAs.","Trail your stop-loss under the 20 EMA as the stock rises."]};
  else if (p200 >= 55 && p20 < 40) t = {h:"Uptrend with a dip: wait for a base", c:"#f2b84b",
    caution:["The long-term trend is healthy but short-term strength has faded.","Don't average down on stocks that closed below their 50 EMA."],
    invest:["Keep long-term holdings and add slowly in the strongest stocks.","Keep some cash ready in case the dip deepens."],
    trade:["Wait for the 20 EMA reading to climb back above 50% before new breakout buys.","Use smaller position sizes until it does."]};
  else if (p50 >= 50 && p200 >= 45) t = {h:"Improving market: build positions gradually", c:"#9bd96b",
    caution:["Breadth is decent but not strong, so some stocks will lag.","Don't put all your money in one stock."],
    invest:["Add in stages and favour stocks above all three EMAs.","Pick quality businesses, not just cheap ones."],
    trade:["Take trades only in stocks above their 50 EMA.","Book part of the profit near recent highs."]};
  else if (p200 < 45 && p20 >= 55) t = {h:"Early recovery: test with small positions", c:"#f2b84b",
    caution:["Rebounds inside a weak trend often fail.","Most stocks are still below the 200 EMA, so the long-term trend is not repaired."],
    invest:["Keep new buying small and staggered.","Hold off on large commitments until the 200 EMA reading rises above 45%."],
    trade:["Use quick, small trades with tight stop-losses.","Take profits early instead of waiting for a big move."]};
  else if (p50 < 35 && p200 < 45) t = {h:"Weak market: stay mostly in cash", c:"#ff6b6b",
    caution:["Most stocks are in a downtrend, and cheap stocks can keep falling.","Avoid new breakout buys and don't average down."],
    invest:["Pause fresh lump-sum investing and continue only SIPs you already run.","Review your holdings and cut the weakest."],
    trade:["Avoid long trades until the 20 EMA reading recovers, then the 50.","If you trade anyway, use half your normal size."]};
  else t = {h:"Mixed market: be selective", c:"#f2b84b",
    caution:["Stocks are moving in different directions, so the index can mislead.","Avoid crowded trades that everyone is in."],
    invest:["Choose individual leaders instead of buying the whole group.","Spread purchases over time."],
    trade:["Trade only stocks above their 50 EMA.","Keep stop-losses tight."]};
  if (p20 >= 80) t.caution.unshift("Over 80% of stocks are above the 20 EMA, so the move is stretched and a pause or dip is likely.");
  if (p200 < 40) t.caution.push("Fewer than 40% of stocks are above the 200 EMA: the long-term trend is damaged.");
  if (s.n < 15) t.caution.push("This group has only " + s.n + " stocks, so one or two big moves can swing the readings.");
  if (s.key !== "all" && all) {
    const d = p50 - all.p50;
    if (d > 10) t.invest.push("This segment is stronger than the broader market (" + Math.round(p50) + "% vs " + Math.round(all.p50) + "% above the 50 EMA), so it can deserve a larger share while that lasts.");
    else if (d < -10) t.caution.push("This segment is weaker than the broader market (" + Math.round(p50) + "% vs " + Math.round(all.p50) + "% above the 50 EMA): money is flowing elsewhere.");
  }
  return t;
}

function chart(r, s) {
  const L = r.line, mn = Math.min(...L), mx = Math.max(...L), W = 600, H = 190;
  const X = i => 10 + i * (W - 20) / (L.length - 1), Y = v => 10 + (mx - v) / ((mx - mn) || 1) * (H - 20);
  const pts = L.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
  const col = r.move >= 0 ? "#4fd1a5" : "#ff6b6b";
  const fmt = v => s.real ? Math.round(v).toLocaleString("en-IN") : v.toFixed(1);
  return `<div class="sub"><b class="${r.move >= 0 ? "up" : "dn"}">${r.move >= 0 ? "+" : ""}${r.move.toFixed(1)}%</b> over ${per} · now ${fmt(L[L.length - 1])}</div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart"><polygon points="${X(0)},${H} ${pts} ${X(L.length - 1)},${H}" fill="${col}" opacity=".15"/>
  <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="10" y="14" fill="#8e95bd" font-size="14">High ${fmt(mx)}</text><text x="10" y="${H - 4}" fill="#8e95bd" font-size="14">Low ${fmt(mn)}</text></svg>
  <div class="note">${s.real ? "Line shows the Nifty 50 index." : "Line shows an equal-weighted average of this group's stocks, not the official index."}</div>`;
}

function list(arr, cls) {
  return arr.length ? arr.map(x => `<div class="row"><span>${stk(x.s, x.n)}</span><span class="${cls}">${x.m > 0 ? "+" : ""}${x.m}%</span></div>`).join("")
    : '<div class="sub">None right now.</div>';
}

function render() {
  if (view === "ov") return renderOverview();
  if (view === "stock") return renderStock();
  if (view === "journal") return renderJournal();
  if (view === "macro") return renderMacro();
  if (view === "swing") return renderSwing();
  if (view === "news") return renderNews();
  const s = D.segments.find(x => x.key === seg), r = calc(s), k = counts(s);
  const all = D.segments.find(x => x.key === "all"), ra = all ? calc(all) : null, p = plan(s, r, ra);
  const chip = x => `<button class="${x.key === seg ? "on" : ""}" onclick="pick('${x.key}')">${esc(x.name)}</button>`;
  const caps = D.segments.filter(x => x.group === "cap"), secs = D.segments.filter(x => x.group === "sector");
  const strong = k.st.filter(x => x.e[0] && x.e[1] && x.e[2]).sort((a, b) => b.m - a.m).slice(0, 6);
  const weak = k.st.filter(x => !x.e[0] && !x.e[1] && !x.e[2]).sort((a, b) => a.m - b.m).slice(0, 6);
  const bars = [20, 50, 200].map((n, i) => {
    const pc = k.st.length ? Math.round(k.c[i] / k.st.length * 100) : 0;
    return `<div class="bar"><b>${n} EMA</b><div class="trk"><i style="width:${pc}%"></i></div><span>${pc}% <small>(${k.c[i]})</small></span></div>`;
  }).join("");
  const rows = D.segments.map(x => ({x, r: calc(x)})).sort((a, b) => b.r.score - a.r.score).map(({x, r}) =>
    `<tr class="go ${x.key === seg ? "sel" : ""}" onclick="pick('${x.key}')"><td>${esc(x.name)}</td><td style="color:${r.color}">${r.mood} (${r.score})</td><td>${Math.round(r.p20)}%</td><td>${Math.round(r.p50)}%</td><td>${Math.round(r.p200)}%</td></tr>`).join("");
  const li = a => a.map(t => "<li>" + t + "</li>").join("");
  $("app").innerHTML = `
  ${nav()}${preopenCard()}<div class="lab">Market</div><div class="chips">${caps.map(chip).join("")}</div>
  <div class="lab">Sectors and themes</div><div class="chips">${secs.map(chip).join("")}</div>
  <div class="mood" style="color:${r.color}">${r.mood}</div>
  <div class="sub">${esc(s.name)}: mood score ${r.score} out of 100 over the last ${per} (stock breadth plus a ${r.move >= 0 ? "+" : ""}${r.move.toFixed(1)}% move).</div>
  <div class="gauge"><i style="left:${r.score}%"></i></div><div class="gl"><span>Bearish</span><span>Neutral</span><span>Bullish</span></div>
  <h2>Trend</h2><div class="chips" style="margin-bottom:10px">${Object.keys(PERIODS).map(q => `<button class="${q === per ? "on" : ""}" onclick="setPer('${q}')">${q}</button>`).join("")}</div>
  ${chart(r, s)}
  <h2>Stocks above their moving average: ${esc(s.name)} (${k.st.length} stocks)</h2>${bars}
  <div class="stats"><div><strong class="up">${k.adv}</strong><small>advancing today</small></div><div><strong class="dn">${k.dec}</strong><small>declining today</small></div><div><strong>${k.dec ? (k.adv / k.dec).toFixed(2) : "–"}</strong><small>advance/decline ratio</small></div></div>
  <h2>How many are performing well</h2>
  <div class="two"><div class="card"><h3>Trend (50 EMA)</h3><div class="row"><span>Above the 50 EMA</span><span class="up">${k.c[1]}</span></div><div class="row"><span>Below the 50 EMA</span><span class="dn">${k.st.length - k.c[1]}</span></div></div>
  <div class="card"><h3>Past month</h3><div class="row"><span>Up</span><span class="up">${k.up1m}</span></div><div class="row"><span>Flat or down</span><span class="dn">${k.dn1m}</span></div></div></div>
  <div class="two" style="margin-top:10px"><div class="card"><h3>Strongest (above all 3 EMAs)</h3>${list(strong, "up")}</div><div class="card"><h3>Weakest (below all 3 EMAs)</h3>${list(weak, "dn")}</div></div>
  <h2>Plan for ${esc(s.name)}</h2>
  <div class="plan" style="border-color:${p.c}"><h3>${p.h}</h3>
  <h4>Be cautious</h4><ul>${li(p.caution)}</ul><h4>If you invest</h4><ul>${li(p.invest)}</ul><h4>If you trade</h4><ul>${li(p.trade)}</ul></div>
  <div class="note">Based on ${Math.round(r.p50)}% of ${esc(s.name)} stocks above the 50 EMA, averaged over the last ${per}.</div>
  ${why(s, r, ra, k)}<h2>Compare segments</h2><table><tr><th>Segment</th><th>Mood</th><th>20 EMA</th><th>50 EMA</th><th>200 EMA</th></tr>${rows}</table>
  <div class="note">Tap a row to open that segment. Rules are written at the top of the script so you can change the thresholds. This is a decision aid, not financial advice.</div>`;
  $("asof").textContent = stamp();
}


let view = "ov", swF = "brk", curStock = null, backView = "ov", chRange = 66, PR = null, prLoading = null, JPRE = {};
const ALLM = {m: 0};
const f1 = v => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
const fv = v => Number(v).toLocaleString("en-IN", {maximumFractionDigits: 2});
const nav = () => `<div class="chips nav">${[["ov", "Overview"], ["seg", "Market and sectors"], ["macro", "Global factors"], ["swing", "Swing trading"], ["news", "News and events"], ["journal", "Journal"]].map(([k, n]) =>
  `<button class="${view === k ? "on" : ""}" onclick="go('${k}')">${n}</button>`).join("")}</div>`;
function go(k) { if (k !== "journal") JPRE = {}; view = k; location.hash = k === "seg" ? seg : k; render(); window.scrollTo(0, 0); }
const link = (t, l) => /^https?:/.test(l || "") ? `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t);

// ---- Global and domestic factor rules: [level, reading, sectors helped (+) or hurt (-)] ----
const R = {
  brent: m => m.m >= 10 ? ["risk", "Crude oil is up " + f1(m.m) + " in a month, which raises inflation and costs.", {oilgas:"+", energy:"+", auto:"-", durables:"-", fmcg:"-", chem:"-"}]
    : m.m <= -10 ? ["watch", "Crude oil is down " + f1(m.m) + " in a month. Cheaper fuel helps costs, but it can also signal weak demand.", {oilgas:"-", energy:"-", auto:"+", fmcg:"+"}]
    : ["ok", "Crude oil is steady (" + f1(m.m) + " in a month).", {}],
  gold: m => m.m >= 5 ? ["risk", "Gold is up " + f1(m.m) + " in a month. Investors are buying safety, which usually means worry in markets.", {}]
    : m.m <= -5 ? ["ok", "Gold is down " + f1(m.m) + " in a month, so there is less fear.", {}]
    : ["ok", "Gold is steady (" + f1(m.m) + " in a month).", {}],
  silver: m => m.m >= 8 ? ["watch", "Silver is up " + f1(m.m) + " in a month: strong demand, but fast runs can reverse.", {metal:"+"}]
    : m.m <= -8 ? ["watch", "Silver is down " + f1(m.m) + " in a month, a sign of weaker metals demand.", {metal:"-"}]
    : ["ok", "Silver is steady (" + f1(m.m) + " in a month).", {}],
  copper: m => m.m >= 6 ? ["ok", "Copper is up " + f1(m.m) + " in a month, a sign of healthy industrial demand.", {metal:"+", infra:"+"}]
    : m.m <= -6 ? ["watch", "Copper is down " + f1(m.m) + " in a month, a sign of worry about growth.", {metal:"-", infra:"-"}]
    : ["ok", "Copper is steady (" + f1(m.m) + " in a month).", {}],
  us10y: m => m.a >= 0.25 ? ["risk", "US bond yields rose " + m.a.toFixed(2) + " points in a month. That pulls foreign money out of emerging markets and pressures high-valuation stocks.", {realty:"-", it:"-", bank:"-", finserv:"-", durables:"-"}]

function signals() {
  const out = [], M = {};
  (D.macro || []).forEach(x => M[x.k] = x);
  Object.keys(R).forEach(k => { if (M[k]) { const r = R[k](M[k]); out.push({k, n: M[k].n, lvl: r[0], txt: r[1], imp: r[2]}); } });
  const fh = ((D.fiidii || {}).hist || []).slice(-5);
  if (fh.length) {
    const a = fh.reduce((t, x) => t + x.fn, 0) / fh.length;
    out.push({k: "fii", n: "FII flows", lvl: a <= -2000 ? "risk" : a <= -800 ? "watch" : "ok", imp: {},
      txt: "Foreign investors have " + (a < 0 ? "sold" : "bought") + " about ₹" + fv(Math.abs(Math.round(a))) + " crore a day on average over the last " + fh.length + " session" + (fh.length > 1 ? "s" : "") + "."});
  }
  const all = D.segments.find(x => x.key === "all");
  if (all) {
    const p = avg(all.p50, 5);
    out.push({k: "breadth", n: "India stock breadth", lvl: p < 35 ? "risk" : p < 50 ? "watch" : "ok", imp: {},
      txt: Math.round(p) + "% of Nifty 500 stocks are above the 50 EMA" + (p < 35 ? ", so selling is widespread." : p < 50 ? ", so the market is not broad." : ".")});
  }
  return out;
}

function fiiBlock() {

  const fn = l.fn, dn = l.dn;

function why(s, r, ra, k) {
  const sg = signals().filter(x => x.imp[s.key]);
  const st = k.st.slice().sort((a, b) => a.d - b.d);
  const dn = st.slice(0, 3).filter(x => x.d < 0), up = st.slice(-3).reverse().filter(x => x.d > 0);
  const dir = r.move >= 0 ? "rising" : "falling", rs = [];
  rs.push(`${esc(s.name)} is ${dir}: ${f1(r.move)} over ${per}. Today ${k.adv} stocks rose and ${k.dec} fell.`);
  rs.push(r.p50 < 35 ? `Selling is widespread: only ${Math.round(r.p50)}% of stocks are above the 50 EMA, so this is a group-wide move, not one stock.`
    : r.p50 >= 65 ? `Buying is broad: ${Math.round(r.p50)}% of stocks are above the 50 EMA, so most of the group is taking part.`
    : `The picture is mixed: ${Math.round(r.p50)}% of stocks are above the 50 EMA, so the move is led by some stocks, not all.`);
  if (s.key !== "all" && ra) {
    const d = r.p50 - ra.p50;
    if (Math.abs(d) >= 10) rs.push(d > 0 ? `It is stronger than the broader market (${Math.round(r.p50)}% vs ${Math.round(ra.p50)}% above the 50 EMA), so money is moving into it.` : `It is weaker than the broader market (${Math.round(r.p50)}% vs ${Math.round(ra.p50)}% above the 50 EMA), so money is moving out of it.`);
  }
  if (dn.length) rs.push("Biggest drags today: " + dn.map(x => `${stk(x.s, x.n)} (${f1(x.d)})`).join(", ") + ".");
  if (up.length) rs.push("Biggest lifts today: " + up.map(x => `${stk(x.s, x.n)} (${f1(x.d)})`).join(", ") + ".");
  sg.forEach(x => rs.push(`${esc(x.txt)} Effect on ${esc(s.name)}: ${x.imp[s.key] === "+" ? "positive" : "negative"}.`));
  const news = [];
  dn.concat(up).forEach(x => ((D.news || {})[x.s] || []).slice(0, 1).forEach(n => news.push({...n, st: x.n})));
  return `<h2>Why is ${esc(s.name)} ${dir}?</h2><div class="card"><ul class="ul" style="margin:0">${li(rs)}</ul>
  ${news.length ? '<h3 style="margin:12px 0 4px">Recent headlines on the biggest movers</h3><ul class="ul" style="margin:0">' + news.map(n => `<li>${link(n.t, n.l)} <span class="mu">${esc(n.p)} ${esc(n.d)} · ${esc(n.st)}</span></li>`).join("") + "</ul>" : ""}
  <div class="note">These are likely drivers from price data and headlines, not confirmed causes. Read the news before acting.</div></div>`;
}

    plan = `<h2>Trade plan</h2><div class="plan" style="border-color:${t.status === "valid" ? "#4fd1a5" : "#f2b84b"}"><b>${t.status === "valid" ? "Valid now" : "Wait for the trigger"}</b>${D.mood && decision() === "NO TRADE" ? ' <span class="tag r">Market says NO TRADE: watchlist only</span>' : ""}
    <ul class="ul"><li><b>Entry trigger:</b> ${t.trig}</li><li><b>Stop-loss:</b> ₹${fv(t.stop)} (${t.rp.toFixed(1)}% below entry)</li><li><b>Invalid if:</b> ${t.inv}</li><li><b>Targets:</b> ₹${fv(t.t1)} (1:2) and ₹${fv(t.t2)} (1:3)</li><li><b>Cancel the plan if:</b> ${t.cancel.join("; ")}.</li></ul>
    <button onclick='JPRE=${JSON.stringify({sym: sym, setup: {brk: "Breakout", near: "Near 52-week high", pull: "EMA pullback", retest: "Breakout retest"}[long[0]], entry: +t.entry.toFixed(2), stop: +t.stop.toFixed(2), target: +t.t1.toFixed(2)})};go("journal")'>Log this trade in the journal</button></div>`;
  }
  const nw = ((D.news || {})[sym] || []).map(n => ({...n})), cats = (E.catalysts || []).filter(x => x.s === sym);
  const sameSec = sec ? (E.catalysts || []).filter(x => x.s && x.s !== sym && sec.stocks.includes(x.s)).slice(0, 3) : [];
  const nl = a => a.map(n => `<div class="nc"><div>${link(n.t, n.l)}</div><div class="mu">${esc(n.p || "")} ${esc(n.d || "")}${n.n ? " · " + esc(n.n) : ""}</div></div>`).join("");
  const news = nw.length || cats.length ? nl(nw.concat(cats)) : '<p class="sub">No recent headline found for this stock. Check the company announcements before trading.</p>';
  const q = encodeURIComponent, tv = "https://www.tradingview.com/chart/?symbol=NSE%3A" + q(sym.replace(/-/g, "_"));
  $("app").innerHTML = `${nav()}${back}
  <h2 style="margin-top:14px">${esc(st.n)}</h2><div class="mu">${esc(sym)}${sec ? " · " + esc(sec.name) : ""}</div>
  <div style="font-size:28px;font-weight:800;margin-top:4px">₹${fv(st.p)} <span class="${st.d >= 0 ? "up" : "dn"}" style="font-size:18px">${f1(st.d)}</span></div>${rangeBar(st)}<div style="margin-top:6px">${tags}</div>
  <div class="card chartbox" id="chart" style="margin-top:12px"><div class="sub">Loading chart…</div></div>${plan}
  <h2>What is driving this stock</h2><div class="card"><ul class="ul" style="margin:0">${li(drivers(sym, st))}</ul></div>
  <h2>News and events</h2>${news}${sameSec.length ? `<h3 style="margin:14px 0 4px">Other headlines from ${esc(sec.name)}</h3>${nl(sameSec)}` : ""}
  <h2>More detail</h2><div class="chips"><a href="${tv}" target="_blank" rel="noopener"><button>Full chart on TradingView</button></a><a href="https://www.screener.in/company/${q(sym)}/" target="_blank" rel="noopener"><button>Fundamentals on Screener</button></a><a href="https://www.nseindia.com/get-quotes/equity?symbol=${q(sym)}" target="_blank" rel="noopener"><button>NSE page</button></a><a href="https://news.google.com/search?q=${q(st.n + " share")}&hl=en-IN&gl=IN&ceid=IN:en" target="_blank" rel="noopener"><button>More news</button></a></div>
  <div class="note">The "driving factors" are read from price, volume, sector, market and headline data. They are likely influences, not proven causes. Headlines are not verified, and a setup can fail even when everything looks right.</div>`;
  loadPrices().then(drawChart);
}

function pick(k) { view = "seg"; seg = k; location.hash = k; render(); window.scrollTo(0, 0); }
function setPer(q) { per = q; render(); }

const LIVE_BASE = "https://raw.githubusercontent.com/Spacewalkin/Indian-market-dashboard/data/";
const LIVE_URL = LIVE_BASE + "data.json";
const getJ = u => fetch(u).then(r => r.ok ? r.text() : null).then(t => t ? JSON.parse(t.replace(/\bNaN\b/g, "null").replace(/-?\bInfinity\b/g, "null")) : null).catch(() => null);
async function loadData(first) {
  const t = Math.floor(Date.now() / 60000);
  const [live, base] = await Promise.all([getJ(LIVE_URL + "?t=" + t), first ? getJ("data.json?v=" + t) : null]);
  return [live, base].filter(Boolean).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0] || null;
}
async function poll() {
  const d = await loadData(false);
  if (!d || !D || (d.ts || 0) <= (D.ts || 0)) return;
  D = d; PR = null;
  const el = document.activeElement, busy = view === "journal" || document.querySelector("details[open]") || (el && ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName));
  if (busy) $("asof").textContent = stamp(); else render();
}
loadData(true).then(d => {
  if (!d) { $("app").innerHTML = '<p class="dn">Could not load the data. Run "Update market data" in GitHub Actions and reload.</p>'; $("asof").textContent = "No data"; return; }
  D = d;
  const h = location.hash.slice(1);
  if (h.startsWith("stock-") && D.stocks[decodeURIComponent(h.slice(6))]) { curStock = decodeURIComponent(h.slice(6)); view = "stock"; }
  else if (["ov", "macro", "swing", "news", "journal"].includes(h)) view = h;
  else if (D.segments.some(x => x.key === h)) { seg = h; view = "seg"; }
  render();
  setInterval(poll, 60000);
  setInterval(() => { if (D) $("asof").textContent = stamp(); }, 30000);
});
</script>
