name: Daily breakout screener

on:
  schedule:
    - cron: "50 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests yfinance
      - run: python screener.py
      - name: Save results
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add breakouts.json
          git commit -m "Update breakout picks" || echo "No changes"
          git pull --rebase
          git push
