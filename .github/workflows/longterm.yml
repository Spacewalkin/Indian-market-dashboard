name: Update long-term data

on:
  schedule:
    - cron: "0 14 * * 1-6"   # 7:30 PM IST, Monday to Saturday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: longterm-data
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-longterm-v1
      - run: pip install yfinance pandas
      - run: python update_longterm.py
      - name: Save longterm.json
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add longterm.json
          git diff --staged --quiet || (git commit -m "Update long-term data" && git pull --rebase && git push)
