name: Long-term research scan

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 7:00 PM IST on weekdays (after market close)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python longterm_scanner.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/longterm.json longterm_report.csv
          git diff --staged --quiet || git commit -m "Update long-term scan"
          git pull --rebase
          git push
