name: Update quarterly results

on:
  schedule:
    - cron: "30 13 * * 1-6"   # 7:00 PM IST, Monday to Saturday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results-data
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-results-v1
      - run: pip install yfinance pandas
      - run: python update_results.py
      - name: Save results.json
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || (git commit -m "Update quarterly results" && git pull --rebase && git push)
