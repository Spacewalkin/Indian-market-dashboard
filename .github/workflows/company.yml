name: Company feed

on:
  schedule:
    - cron: "30 2 * * *"     # 8:00 AM India time
    - cron: "30 12 * * *"    # 6:00 PM India time
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional: NSE symbols separated by spaces (leave empty for the normal automatic run)"
        required: false

permissions:
  contents: write

concurrency:
  group: company-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install yfinance requests

      - name: Build company feed from the NSE list and the news
        run: python update_company.py ${{ github.event.inputs.symbols }}

      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add company.json nse_names.json
          git diff --staged --quiet || (git commit -m "Daily company feed update" && git pull --rebase && git push)
