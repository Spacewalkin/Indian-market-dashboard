name: Update market data

on:
  schedule:
    - cron: "15 3 * * 1-5"      # 8:45 AM IST
    - cron: "40 3 * * 1-5"      # 9:10 AM IST
    - cron: "30 4 * * 1-5"      # 10:00 AM IST
    - cron: "15 5 * * 1-5"      # 10:45 AM IST
    - cron: "0,30 6 * * 1-5"    # 11:30 AM and 12:00 PM IST
    - cron: "30 7 * * 1-5"      # 1:00 PM IST
    - cron: "0,30 8-16 * * 1-5" # every 30 min, 1:30 PM to 10:00 PM IST
  workflow_dispatch:         # lets you run it by hand too

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python update_data.py
        env:
          RUN_SCHEDULE: ${{ github.event.schedule }}
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update market data" && git pull --rebase && git push)
