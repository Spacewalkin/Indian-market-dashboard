name: Update market data

on:
  schedule:
    - cron: "15 3 * * 1-5"      # 8:45 AM IST
    - cron: "40 3 * * 1-5"      # 9:10 AM IST
    - cron: "30 4 * * 1-5"      # 10:00 AM IST
    - cron: "15 5 * * 1-5"      # 10:45 AM IST
    - cron: "0,30 6 * * 1-5"    # 11:30 AM and 12:00 PM IST
    - cron: "30 7 * * 1-5"      # 1:00 PM IST
    - cron: "0,30 8-16 * * 1-5" # every 30 min, 1:30 PM to 10:00 PM IST
  workflow_dispatch:            # lets you run it by hand, or an outside timer trigger it
    inputs:
      run_schedule:
        description: "Leave empty for a full run. An outside timer sends the quick live mode here."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python update_data.py
        env:
          RUN_SCHEDULE: ${{ github.event.schedule || github.event.inputs.run_schedule }}
      # "if: always()" saves status.json and the audit log even when the script fails,
      # so the site can show DATA NOT VERIFIED. The run still shows as failed (and GitHub emails you).
      - name: Save results
        if: always()
        env:
          RUN_SCHEDULE: ${{ github.event.schedule || github.event.inputs.run_schedule }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"

          # 1) Live copy: the page reads data.json, prices.json and status.json from the "data" branch
          #    every minute. It is replaced by one fresh commit each run, so the repo never grows
          #    and the website is not rebuilt.
          rm -rf /tmp/databr && mkdir /tmp/databr
          for f in data.json prices.json status.json; do
            if [ -e "$f" ]; then cp "$f" /tmp/databr/; fi
          done
          if [ -n "$(ls -A /tmp/databr)" ]; then
            (
              cd /tmp/databr
              git init -q -b data
              git config user.name "market-bot"
              git config user.email "bot@users.noreply.github.com"
              git add -A
              git commit -q -m "Live data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
            )
          fi

          # 2) Main copy (the site's own backup and the history): skipped for the quick live runs
          if [ "$RUN_SCHEDULE" != "*/5 3-10 * * 1-5" ]; then
            for f in data.json prices.json status.json audit_log.jsonl snapshots; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
            # The log file only ever grows, so when two copies differ keep the lines from both.
            # The other files are rebuilt every run, so on a clash keep the newest version (ours).
            echo "audit_log.jsonl merge=union" >> .git/info/attributes
            if ! git diff --staged --quiet; then
              git commit -m "Update market data"
              saved=0
              for i in 1 2 3 4; do
                if git pull --rebase --autostash -X theirs && git push; then saved=1; break; fi
                git rebase --abort 2>/dev/null || true
                echo "Save attempt $i did not go through, trying again"
                sleep 8
              done
              if [ "$saved" != "1" ]; then
                echo "Could not save the main copy. The live copy on the data branch was already updated."
              fi
            fi
          fi
