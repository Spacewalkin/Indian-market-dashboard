name: Update market data

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST, Monday to Friday
  workflow_dispatch:          # lets you run it by hand too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python update_data.py
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update market data" && git push)
