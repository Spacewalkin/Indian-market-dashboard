name: Live market snapshot

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"   # every 5 minutes, 8:30 AM to 4:25 PM IST (GitHub may run it late)
  workflow_dispatch:             # lets you run it by hand too

permissions:
  contents: write

concurrency:
  group: live-snapshot
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: Get the previous snapshot (keeps this morning's pre-open view)
        run: |
          git fetch origin live-data:refs/remotes/origin/live-data || true
          git show origin/live-data:live.json > prev_live.json 2>/dev/null || true
      - run: python update_live.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Publish live.json on the live-data branch
        run: |
          [ -f live.json ] || exit 0
          mkdir /tmp/pub && cp live.json /tmp/pub/ && cd /tmp/pub
          git init -q -b live-data
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live.json
          git commit -q -m "Live snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
