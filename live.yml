name: Live market data

on:
  schedule:
    - cron: "5,20,35,50 3-10 * * 1-5"   # every 15 minutes, about 8:35 AM to 4:35 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: Start from the latest saved data
        run: |
          git fetch origin data --depth=1 && for f in data.json prices.json; do git show FETCH_HEAD:$f > /tmp/prev_$f && cp /tmp/prev_$f $f || true; done || echo "No data branch yet"
      - run: python update_data.py
        env:
          RUN_SCHEDULE: "*/5 3-10 * * 1-5"   # tells the script to do the quick live refresh
      - name: Publish to the data branch
        run: |
          mkdir /tmp/pub && cp data.json /tmp/pub/ && (cp prices.json /tmp/pub/ 2>/dev/null || true) && cd /tmp/pub
          git init -q -b data
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "Live data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
